name: Validate prompts

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  aps:
    name: APS prompt validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate APS-1.0 prompt metadata
        run: python3 scripts/validate-prompts.py
